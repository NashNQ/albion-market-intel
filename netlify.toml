[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Données publiées par le workflow GitHub sur la branche `data`, servies en same-origin.
[[redirects]]
  from = "/data/*"
  to = "https://raw.githubusercontent.com/NashNQ/albion-market-intel/data/:splat"
  status = 200
  force = true

# SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
